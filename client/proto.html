<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Caféstjärnan: prototyp</title>
  <style>
    :root { --ink:#3a2a33; --bg:#fff4df; --red:#ef4d3c; --yellow:#ffc730; --green:#3fc9a0; --blue:#3fa7f5; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:20px/1.4 system-ui, sans-serif; }
    #app { max-width:760px; margin:0 auto; padding:16px; }
    h1,h2,h3 { margin:.4em 0; }
    .top { display:flex; justify-content:space-between; font-weight:700; font-size:1.1em; background:var(--yellow); padding:8px 12px; border-radius:12px; }
    .card { background:#fff; border:3px solid var(--ink); border-radius:14px; padding:12px; margin:12px 0; }
    button { font:inherit; font-weight:700; padding:8px 14px; margin:3px; border:3px solid var(--ink); border-radius:12px; background:var(--green); cursor:pointer; color:var(--ink); }
    button.alt { background:var(--blue); } button.warn { background:var(--red); color:#fff; } button.big { font-size:1.3em; padding:12px 20px; background:var(--yellow); }
    button:disabled { opacity:.4; cursor:not-allowed; }
    input[type=text], input[type=number] { font:inherit; padding:6px 10px; border:3px solid var(--ink); border-radius:10px; width:6em; max-width:100%; }
    .card { overflow-x:auto; }
    input.answer { font-size:1.6em; width:5em; text-align:center; }
    .msg { min-height:1.6em; font-weight:700; } .err { color:var(--red); } .ok { color:#118a63; }
    .order { font-size:1.5em; font-weight:700; }
    .bar { height:16px; background:#ddd; border:2px solid var(--ink); border-radius:8px; overflow:hidden; } .bar > div { height:100%; background:var(--green); }
    table { border-collapse:collapse; width:100%; } td,th { padding:4px 8px; border-bottom:1px solid #ccc; text-align:left; }
    .grid { display:inline-grid; gap:3px; } .grid button { width:44px; height:44px; padding:0; margin:0; background:#fff; } .grid .lab { display:flex; align-items:center; justify-content:center; font-weight:700; }
    .queue button { font-size:2em; background:#fff; } small { opacity:.7; }
    .stalls { display:flex; flex-wrap:wrap; gap:10px; } .stall { flex:1 1 300px; border:3px solid var(--ink); border-radius:12px; padding:4px 8px; background:#fff9ec; } .stall h3 { margin:2px 0; } .stall button { font-size:.8em; padding:5px 9px; }
    .chip { display:inline-block; border:2px dashed var(--ink); border-radius:12px; padding:2px 6px; margin:3px; background:#fff; cursor:grab; }
    .base { font-size:1.8em; min-height:84px; padding:10px; margin:6px 0; border:3px dashed var(--ink); border-radius:24px; background:#fde9c3; }
    .base.over { background:#c8f5e6; }
    label.chk { display:inline-block; margin:2px 10px 2px 0; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/proto.ts"></script>
</body>
</html>
